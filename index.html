<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scott Feichter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
</head>
<body>
<script>
    (function() {
        const ua = navigator.userAgent;

        const isMobile = /Mobi|Android.*Mobile|iPhone|iPod/.test(ua);
        const isMac = /Macintosh/.test(ua);
        const isIPad = (isMac && navigator.maxTouchPoints > 0) || /iPad/.test(ua);
        const isAndroidTablet = /Android/.test(ua) && !/Mobile/.test(ua);
        const isTablet = isIPad || isAndroidTablet;

        let target;
        if (isMobile || isTablet) {
            target = '/_mobile/html/home.html';
        } else {
            target = '/_desktop/html/home.html';
        }

        fetch(target)
            .then(res => res.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Replace head and body
                document.head.innerHTML = doc.head.innerHTML;
                document.body.innerHTML = doc.body.innerHTML;

                // Re-execute scripts sequentially (DOMParser does not run them)
                const scripts = [...document.body.querySelectorAll('script')];
                function loadNext(i) {
                    if (i >= scripts.length) return;
                    const oldScript = scripts[i];
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                        newScript.onload = () => loadNext(i + 1);
                        newScript.onerror = () => loadNext(i + 1);
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    } else {
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                        loadNext(i + 1);
                    }
                }
                loadNext(0);
            })
            .catch(err => console.error('Failed to load page:', err));
    })();
</script>
</body>
</html>
