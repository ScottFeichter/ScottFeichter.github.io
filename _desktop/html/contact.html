                <textarea id="message" name="message" placeholder="Write something..&#10;&#10;NOTE:&#10;&#10;If you don't leave any contact information in the message I won't be able to reply." style="height:200px"></textarea>

                <input type="submit" value="Submit">
            </form>
            <div id="form-success" style="display:none; text-align:center; padding: 2rem 0;">
                <h2 style="font-size: 1.6rem; font-weight: 600;">Message successfully sent!</h2>
