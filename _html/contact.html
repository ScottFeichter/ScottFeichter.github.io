<!---------------------------------------------------BODY----------------------------------------------------->
<body>

<!---------------------------------------------------Nav----------------------------------------------------->
<nav id="site-nav">
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/portfolio">Portfolio</a></li>

<!---------------------------------------------------Page Content----------------------------------------------------->
<div id="page-content">

    <main class="Main">

        <div class="Contact">
            <h1>Contact Me</h1>
            <hr>
            <h3><a href="tel:4157028512">415-702-8512</a></h3>
            <h3><a href="mailto:scottfeichter@gmail.com">scottfeichter@gmail.com</a></h3>
        </div>

        <div class="Form" id="contact-form-card">
            <h2 id="form-heading">Send a Message</h2>
            <form id="contact-form" action="https://formspree.io/f/mnpdpwok" method="POST">
                <label for="fname">Name</label>
                <input type="text" id="fname" name="name" placeholder="Your name..">

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="555-555-5555..">

                <label for="reason">Subject</label>
                <select id="reason" name="subject">
                    <option value="">Select a reason...</option>
                    <option value="Job Opportunity">Job Opportunity</option>
                    <option value="Freelance Project">Freelance Project</option>
                    <option value="Collaboration">Collaboration</option>
                    <option value="Other">Other</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write something.." style="height:200px"></textarea>

                <input type="submit" value="Submit">
            </form>
            <div id="form-success" style="display:none; text-align:center; padding: 2rem 0;">
                <h2 style="font-size: 1.6rem; font-weight: 600;">Message successfully sent!</h2>
            </div>
        </div>

    </main>

    <footer class="Footer">
        <h3 id="copyright">Copyright &copy; Scott Feichter 2027</h3>
    </footer>

</div>

<script src="/_js/nav.js"></script>
